# Ambre nightly — the long runs, OUTSIDE PRs (user rule 2026-10-24,
# see ~/Bureau/CI-BUDGET-5MIN.md: a CI run that needs more than 5 minutes is
# moved out of the PR path, it is never given a longer timeout there).
#
# Never triggered by pull_request: only schedule + workflow_dispatch.
# Each job still carries an explicit timeout-minutes, justified below.

name: nightly

on:
  schedule:
    # 02:17 UTC every night (off the top of the hour: less runner contention).
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  explore-full:
    name: exhaustive exploration (every reachable state)
    runs-on: ubuntu-latest
    # 30 min : `--states 1000000` is an upper bound; the reachable state space
    # of the reference 30 s scenario measures 64 591 states (334 s exploration,
    # 5 min 37 s wall including build, dev machine 2026-11-11). 30 min keeps a
    # >= 5x margin for slower runners, hors PR (règle CI 5 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain
        run: |
          command -v gcc >/dev/null && command -v python3 >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential python3
          }
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
          fi

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-nightly-${{ hashFiles('fmt/**', 'host/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-nightly-

      # make explore-full = make all + scenario + exhaustive exploration:
      # --states 1000000 is a cap above the reachable space (64 591 states
      # measured on the reference scenario, nested variant included).
      - name: make explore-full
        run: make explore-full

      - name: full exploration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-full-report
          path: build/explore-full.json
          if-no-files-found: ignore
          retention-days: 14

  crosscheck:
    name: C vs Python crosscheck (10 000 scenarios)
    runs-on: ubuntu-latest
    # 15 min : mesuré 2 min 32 s sur la machine de dev (2026-11-11) —
    # 10 000 scénarios, 2 744 840 lignes de décisions comparées, fichiers
    # .dec identiques octet pour octet. Marge >= 5x pour runners plus lents,
    # hors PR (règle CI 5 min).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain
        run: |
          command -v gcc >/dev/null && command -v python3 >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential python3
          }
          if command -v ccache >/dev/null 2>&1; then
            echo "CC=ccache gcc" >> "$GITHUB_ENV"
          fi

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-crosscheck-${{ hashFiles('fmt/**', 'host/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-crosscheck-

      # make crosscheck = make all + 10 000 vectors + C decisions + Python diff.
      - name: make crosscheck
        run: make crosscheck
