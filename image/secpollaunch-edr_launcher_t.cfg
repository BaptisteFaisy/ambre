#
# image/secpollaunch-edr_launcher_t.cfg — ce que le lanceur a le droit de faire
# naître, et COMMENT.
#
# Le nom du fichier n'est pas libre : `secpollaunch` détermine son chemin d'après
# le TYPE DE SÉCURITÉ de l'appelant, toujours sous /proc/boot :
#     /proc/boot/secpollaunch-<type>.cfg      (docs/secpollaunch.html)
# Le type de l'appelant ici est edr_launcher_t (image/ambre.sec), le type 0 :
# celui de tout ce que le script de démarrage amorce sans `-T` — le ksh de la
# démo, toybox, les sondes du banc.
#
# Pourquoi ce mécanisme et pas `on -T <type>` depuis le shell : un appelant qui
# typerait lui-même ses enfants devrait porter la capacité `settypeid`, donc
# `gain_priv` (secpolcompile refuse sinon, et il a raison) — le shell deviendrait
# capable de se changer en edr-journal et d'écrire le média. Ici le shell ne
# peut QUE nommer une section : c'est la configuration, relue par l'auditeur et
# posée en 0444 dans l'IFS, qui fixe le binaire, les arguments, le type, les
# credentials et l'environnement. SEC-02 en tire une conséquence forte : la
# ligne de commande de l'enregistreur ne peut pas être altérée depuis l'espace
# utilisateur, même par un shell root.
#
# Conditions posées par la documentation (toutes réunies ici) :
#   - le système utilise une politique (secpolpush au démarrage, @SECURITY_SETUP@
#     de image/vitrine.build) ;
#   - l'appelant est NON-ROOT et ne peut pas redevenir root (le script de démo et
#     le shell de banc sont amorcés avec `on -u 100:100`, edr_launcher_t n'a
#     aucune capacité setuid) ;
#   - le binaire secpollaunch est setuid root ([perms=4755] dans l'IFS).
#
# Formats utilisés (docs/secpollaunch.html, « Configuration file format ») :
#   cmd  = chemin absolu + arguments, %n/%1-/%* substituant les arguments de
#          l'appelant ;
#   type = le type de sécurité du nouveau processus ;
#   creds = uid:gid[:gid…] — le gid porte ici le TYPE DE PAIR que la matrice C
#           ambre_port_access_allowed() vérifie (edr_gate,
#           target/journal/edr_journal_io_qnx.c), pas le type noyau : les deux
#           contrôlent des choses différentes et aucun ne remplace l'autre.
#   launch_if = path … — n'amorce que si le critère est là.

[global]
    set_env = PATH=/proc/boot LD_LIBRARY_PATH=/proc/boot
    keep_env = TERM
    umask = 0022

# edr-journal — type noyau edr_journal_t, pair JOURNAL (gid 1). Seul à ouvrir le
# média brut (STO-01) : le canal de devb-eide ne peut être connecté que par ce
# type (image/ambre.sec, `allow edr_journal_t devb_t:channel connect`).
[edr_journal]
    cmd = /proc/boot/edr-journal --disk /dev/hd0t177 --listen /dev/edr/journal \
          --mode continuous --segment-limit 4
    type = edr_journal_t
    creds = 0:1
    launch_if = path /dev/hd0t177

# edr-capture — type edr_capture_t, pair CAPTURE (gid 2). Publie l'entrée des
# producteurs (/dev/edr/in, ACQ-01) et ne parle au journal qu'en écriture
# d'événements (trigger/continue/seal/gap).
[edr_capture]
    cmd = /proc/boot/edr-capture --journal /dev/edr/journal --listen /dev/edr/in \
          --profile eu
    type = edr_capture_t
    creds = 0:2
    launch_if = path /dev/edr/journal

# edr-replay — producteur (AMBRE_PEER_PRODUCER, gid 3) : il n'a que le droit
# d'écrire l'entrée de capture, jamais d'approcher le média ni le journal.
[edr_replay]
    cmd = /proc/boot/edr-replay --capture /dev/edr/in --scenario /proc/boot/scenario.txt
    type = edr_producer_t
    creds = 0:3
    launch_if = path /dev/edr/in

# edrctl — le service de lecture (AMBRE_PEER_SERVICE, gid 4) : status, list,
# export, verify. Les arguments de l'appelant sont relayés tels quels (%1-),
# c'est le seul endroit où un humain choisit quelque chose — et ce choix reste
# borné à READ_STATUS/READ_EVENTS par la matrice C et par la politique noyau.
[edrctl]
    cmd = /proc/boot/edrctl --journal /dev/edr/journal %1-
    type = edr_service_t
    creds = 0:4
    launch_if = path /dev/edr/journal

# devctl_probe — le client devctl() du journal (QNX-01, QNX-03, OBS-02, EXP-01,
# EXP-08). Meme type et memes credentials qu'edrctl : c'est un outil de SERVICE,
# et la matrice ne doit pas distinguer les deux. Lance directement (sans cette
# configuration), il serait du type du lanceur et la politique lui refuserait le
# canal du journal — ce qui est exactement le test (c) de secpol_probe.
[devctl_probe]
    cmd = /proc/boot/devctl_probe --journal /dev/edr/journal %1-
    type = edr_service_t
    creds = 0:4
    launch_if = path /dev/edr/journal

# edr-archive — pair ARCHIVE (gid 5), type edr_archive_t : lit les événements
# scellés et écrit les MCAP sur le SECOND média monté (STO-07), jamais sur le
# média du journal. `launch_if` sur /arch : pas d'archive sans support d'archive
# monté, et donc pas d'écriture à vide.
[edr_archive]
    cmd = /proc/boot/edr-archive --journal /dev/edr/journal --out /arch
    type = edr_archive_t
    creds = 0:5
    launch_if = path /arch
