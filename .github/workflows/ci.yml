# Ambre CI — verdict in 5 minutes maximum (user rule 2026-10-24,
# see ~/Bureau/CI-BUDGET-5MIN.md).
#
# Hard rules applied here, on every job:
#   * timeout-minutes: 5            (never extended, never removed)
#   * concurrency + cancel-in-progress: true
#   * actions/checkout with fetch-depth: 1
#   * no hard-coded sleep > 30 s
# Anything that does not fit in 5 minutes is NOT here: it lives in
# nightly.yml (workflow_dispatch / schedule, never on a PR).

name: ci

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + C unit tests
    runs-on: [self-hosted, Linux, X64, ambre-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      # ubuntu-latest already ships gcc + python3; install only if missing.

      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-c-${{ hashFiles('fmt/**', 'host/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-c-

      # Measured 2026-11-11 on the dev machine: `make all` 2.8 s, `make test`
      # 9.7 s (9 C suites, 8 070 checks) — this job is nowhere near 5 minutes.
      - name: make all
        run: make all

      - name: make test
        run: make test

      # C++17 archive (cahier section 9): the MCAP writer and the archive
      # process, cross-checked against the Python reader in host/mcap.
      - name: make test_archive_cpp
        run: make test_archive_cpp

      # The QNX glue compiles against target/qnx-stub/include: objects only,
      # never linked, so a missing QNX symbol cannot break the PC build.
      # Proves syntax and prototypes, not behaviour (docs/QNX-PORT.md).
      - name: make qnx-syntax
        run: make qnx-syntax

      # Static consistency of image/ (process names, priorities of spec 4.4,
      # security policy types, distinct partitions, no network, no stop
      # command). Cannot build a real image without the QNX SDP.
      - name: make image-check
        run: make image-check

  python-tests:
    name: Python twin tests
    runs-on: [self-hosted, Linux, X64, ambre-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      - name: trigger crosscheck self-test
        run: timeout 120 python3 host/verify/trigger_crosscheck.py --self

  explore:
    name: power-cut exploration (10 000 states)
    runs-on: [self-hosted, Linux, X64, ambre-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false


      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-explore-${{ hashFiles('fmt/**', 'host/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-explore-

      # make explore = make all + scenario + 10 000 states (level 1).
      # Measured 2026-11-11 on the dev machine (x86-64, gcc): build 2.8 s,
      # 10 000 states in 29 s at --jobs 12 and in 27 s pinned to 2 cores
      # (taskset, --jobs 2) -> the job stays far under the 5-minute budget on
      # any runner, so the state count is NOT reduced. The exhaustive run
      # (every reachable state: 64 591 measured, ~5.5 min) lives in nightly.yml
      # as `make explore-full`; it does not fit the PR budget on slow runners.
      - name: make explore
        run: make explore

      - name: exploration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-report
          path: build/explore.json
          if-no-files-found: ignore
          retention-days: 7

  sizecheck:
    name: house rule (<500 lines / <50 lines)
    runs-on: [self-hosted, Linux, X64, ambre-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      # Runs scripts/sizecheck.py over fmt/ host/ tests/ scripts/ through the
      # Makefile target (measured 2026-11-11: 61 files scanned, 0 violation,
      # < 1 s). Fails the build if any file reaches 500 lines or any function
      # reaches 50 lines.
      - name: make sizecheck
        run: make sizecheck
